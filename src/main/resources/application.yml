spring:
  application:
    name: withdrawal-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bank}
    username: ${DB_USER:bank}
    password: ${DB_PASSWORD:bank}
    hikari:
      # The pool, not the servlet container's thread count, is the real throughput
      # ceiling on this path: every request blocks on a connection. Sized to what the
      # database can service concurrently rather than to expected request volume.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 3000
      pool-name: withdrawal-pool

      # The conditional debit depends on READ COMMITTED re-evaluating its WHERE
      # clause against the newly committed row. At REPEATABLE READ and above the
      # same statement raises a serialization failure instead, which turns an
      # ordinary insufficient-funds result into an error. PostgreSQL's factory
      # default is read committed, but that is a server setting a DBA or a pooler
      # can change without touching this repository, so it is pinned here.
      transaction-isolation: TRANSACTION_READ_COMMITTED

      # Bounds how long a request can wait on a contended account row. Without it
      # one long-held transaction backs requests up until the pool drains and
      # callers start seeing connection timeouts instead of a useful status code.
      # Surfaces as SQLSTATE 55P03 -> CannotAcquireLockException -> 503.
      connection-init-sql: "SET lock_timeout = '3s'"

  flyway:
    enabled: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,outbox
  endpoint:
    health:
      show-details: always
      # Registers the livenessState / readinessState contributors. Without this
      # they do not exist outside Kubernetes and the group definitions below
      # fail application startup.
      probes:
        enabled: true
      # The outbox indicator is deliberately excluded from liveness and readiness.
      # A backlog means the broker is unhappy, not that this instance is broken -
      # restarting pods during that incident would make it strictly worse.
      group:
        liveness:
          include: livenessState,db
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Without this the timers publish count, sum and max only, which is enough
      # for an average and useless for an SLO - and an average latency on a
      # payment endpoint hides exactly the tail that matters. Histogram buckets
      # are what let p95 and p99 be computed at query time, and aggregated
      # correctly across instances, which client-side percentiles cannot be.
      percentiles-histogram:
        withdrawal.duration: true
        http.server.requests: true
      # Buckets chosen around the latencies this endpoint should actually meet.
      # Publishing every default bucket multiplies series count for no benefit.
      slo:
        withdrawal.duration: 25ms,50ms,100ms,250ms,500ms,1s,3s
        http.server.requests: 50ms,100ms,250ms,500ms,1s,3s
      minimum-expected-value:
        withdrawal.duration: 5ms
      maximum-expected-value:
        withdrawal.duration: 10s

app:
  aws:
    region: ${AWS_REGION:af-south-1}
    topic-arn: ${SNS_TOPIC_ARN:arn:aws:sns:af-south-1:000000000000:withdrawal-events}
    # Set only for LocalStack. Empty in a real deployment, where credentials come
    # from the default AWS resolution chain (instance role / IRSA), never config.
    endpoint-override: ${AWS_ENDPOINT_OVERRIDE:}
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}

  withdrawal:
    settlement-account-id: 9000
    default-currency: ZAR
    idempotency-ttl-hours: 24

  outbox:
    poll-interval-ms: 2000
    batch-size: 20
    # Ceiling for transient-failure backoff. No attempt limit - see OutboxRelayStore.
    backoff-cap-seconds: 300
    purge-published-after-days: 7

  reconciliation:
    interval-ms: 60000
    initial-delay-ms: 15000

  retention:
    cron: "0 0 3 * * *"

  # Cron expressions above are wall-clock in this zone. Storage is TIMESTAMPTZ and
  # unaffected - this only decides when the nightly jobs fire.
  schedule:
    zone: ${SCHEDULE_ZONE:Africa/Johannesburg}

logging:
  level:
    com.sanlam.banking.withdrawal: INFO
